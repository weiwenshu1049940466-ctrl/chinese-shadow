<html lang="en">

<head>
	<meta charset="utf-8" />

	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			background: radial-gradient(ellipse at 55% 48%, rgb(255, 232, 166) 0%, rgb(230, 168, 92) 52%, rgb(170, 112, 58) 100%);

		body {
			position: fixed;
			inset: 0;

			display: block;
			position: fixed;
			inset: 0;
			width: 100vw !important;
			height: 100vh !important;

		video {
			display: none !important;
		}
